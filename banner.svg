<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Fawwaz Lawal, software engineer">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ece6dc" opacity="0.07"/>
    </pattern>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f1013" stop-opacity="0"/>
      <stop offset="1" stop-color="#0f1013" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#0f1013"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect x="700" y="0" width="500" height="300" fill="url(#vignette)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <circle cx="70" cy="88" r="3.5" fill="#d9623a">
      <animate attributeName="opacity" values="1;0.35;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <text x="86" y="93" font-size="13" letter-spacing="4" fill="#d9623a">SOFTWARE ENGINEER</text>
  </g>

  <text x="64" y="178" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
        font-size="84" letter-spacing="-1" fill="#ece6dc">Fawwaz Lawal</text>

  <line x1="64" y1="206" x2="1136" y2="206" stroke="#2a2c33" stroke-width="1"/>
  <rect x="64" y="205" width="0" height="2" fill="#d9623a">
    <animate attributeName="width" from="0" to="160" dur="1.4s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.1 1"/>
  </rect>

  <text x="64" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="15" letter-spacing="2" fill="#9a948b">Go services  ·  Swift and SwiftUI clients  ·  security background</text>

  <text x="1136" y="246" text-anchor="end" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
        font-style="italic" font-size="20" fill="#7f7870">Measure before you claim.</text>
</svg>
