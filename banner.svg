<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Fawwaz Lawal - Software Engineer">
  <defs>
    <linearGradient id="redfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1e1e" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff1e1e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1e1e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff4040" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff1e1e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 L0 40" fill="none" stroke="#3a1010" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.4" fill="#000000" opacity="0.40"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feColorMatrix in="b" type="matrix" result="r"
        values="1 0 0 0 0  0 0.18 0 0 0  0 0 0.18 0 0  0 0 0 0.55 0"/>
      <feMerge>
        <feMergeNode in="r"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <path d="M0 0 H1164 L1200 36 V300 H36 L0 264 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#07070a"/>
    <rect width="1200" height="300" fill="url(#grid)" opacity="0.55"/>
    <rect x="0" y="0" width="520" height="300" fill="url(#redfade)" opacity="0.07"/>

    <rect x="0" y="0" width="7" height="300" fill="#ff1e1e"/>
    <rect x="0" y="0" width="7" height="110" fill="#ff5a5a"/>

    <text x="62" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="15" letter-spacing="5" fill="#ff1e1e" opacity="0.95">// PERSONNEL RECORD</text>
    <text x="62" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" letter-spacing="3" fill="#6b5f58">SYS.DEV &#183; CLASS 01 &#183; INDEPENDENT</text>

    <text x="60" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="74" font-weight="bold" letter-spacing="7" fill="#eee6dc"
          filter="url(#glow)">FAWWAZ LAWAL</text>

    <rect x="62" y="200" width="620" height="3" fill="#ff1e1e"/>
    <rect x="62" y="200" width="150" height="3" fill="#ffffff" opacity="0.8"/>

    <text x="62" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" letter-spacing="5" fill="#b9aca2">SOFTWARE ENGINEER</text>
    <text x="62" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="14" letter-spacing="4" fill="#ff1e1e" opacity="0.85">iOS &#183; GO &#183; SYSTEMS &#183; SECURITY</text>

    <rect x="380" y="252" width="11" height="18" fill="#ff1e1e">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="1130" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="30" letter-spacing="6" fill="#ff1e1e" writing-mode="tb" opacity="0.65">&#38283;&#30330;</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5a4a44">
      <text x="930" y="196">NODE.......FawwazLawal</text>
      <text x="930" y="214">STACK......SWIFT / GO</text>
      <text x="930" y="232">UPTIME.....CONTINUOUS</text>
    </g>
    <circle cx="916" cy="192" r="4" fill="#2bff6a">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <path d="M24 24 H92 M24 24 V92" stroke="#ff1e1e" stroke-width="2" fill="none" opacity="0.85"/>
    <path d="M1176 276 H1108 M1176 276 V208" stroke="#ff1e1e" stroke-width="2" fill="none" opacity="0.85"/>

    <rect x="0" y="-6" width="1200" height="4" fill="url(#sweep)" opacity="0.7">
      <animate attributeName="y" values="-6;304" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <rect width="1200" height="300" fill="url(#scan)"/>
  </g>

  <path d="M0 0 H1164 L1200 36 V300 H36 L0 264 Z" fill="none" stroke="#ff1e1e" stroke-width="2" opacity="0.6"/>
</svg>
