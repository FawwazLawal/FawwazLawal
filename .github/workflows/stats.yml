name: Refresh stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gen/stats_cards.py
      - .github/workflows/stats.yml

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate cards
        run: python3 gen/stats_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: FawwazLawal
      - name: Commit if changed
        run: |
          git config user.name "FawwazLawal"
          git config user.email "263737229+FawwazLawal@users.noreply.github.com"
          git add -A assets/stats.svg assets/repos README.md
          git diff --cached --quiet || { git commit -m "Refresh stats and repository cards"; git push; }
